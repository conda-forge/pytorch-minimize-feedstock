schema_version: 1

context:
  name: pytorch-minimize
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 8586c2050c7a0ec0d34178c1bd40206a4f9402f63ff6628f42481d6d5f2200c2

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=46.4.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.18.0
    - scipy >=1.6
    - pytorch >=1.9.0

tests:
  - python:
      imports:
        - torchmin
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Newton and Quasi-Newton optimization with PyTorch
  license: MIT
  license_file: LICENSE
  homepage: https://pytorch-minimize.readthedocs.io

extra:
  recipe-maintainers:
    - jan-janssen
