{% set name = "pytorch-minimize" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 8586c2050c7a0ec0d34178c1bd40206a4f9402f63ff6628f42481d6d5f2200c2

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=46.4.0
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.18.0
    - scipy >=1.6
    - pytorch >=1.9.0

test:
  imports:
    - torchmin
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pytorch-minimize.readthedocs.io
  summary: Newton and Quasi-Newton optimization with PyTorch
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
